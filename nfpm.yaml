# The .deb and .rpm of fat32expander, built by the repo-infra piece
# ri-release-nfpm from the musl archives. The piece fills in VERSION, MTIME
# and ARCH, and STAGE, the unpacked fat32expander/ folder of one archive,
# before nfpm reads this file. Write no dollar-brace name in a comment
# either: the piece fills in the whole file and stops at a name it does not
# know. nfpm adds no automatic requirements, so the static binary depends on
# nothing.
name: fat32expander
arch: "${ARCH}"
platform: linux
version: "${VERSION}"
release: "1"
# nfpm ignores SOURCE_DATE_EPOCH, so the timestamp is set here.
mtime: "${MTIME}"
section: admin
priority: optional
maintainer: Tobias Oetiker <tobi@oetiker.ch>
license: MIT
homepage: https://github.com/oetiker/fat32expander
description: |
  Grow a FAT32 filesystem in place after its partition was enlarged
  fat32expander enlarges a FAT32 filesystem to fill its grown partition or
  disk image. When the FAT tables must grow, it moves the data clusters in
  their way, and a checkpoint lets an interrupted resize continue.
  A single static binary.
contents:
  - src: ${STAGE}/fat32expander
    dst: /usr/bin/fat32expander
    file_info:
      mode: 0755
  - src: ${STAGE}/man/fat32expander.8.gz
    dst: /usr/share/man/man8/fat32expander.8.gz
    file_info:
      mode: 0644
  - src: ${STAGE}/README.md
    dst: /usr/share/doc/fat32expander/README.md
    file_info:
      mode: 0644
  - src: ${STAGE}/LICENSE
    dst: /usr/share/doc/fat32expander/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: ${STAGE}/LICENSE
    dst: /usr/share/doc/fat32expander/LICENSE
    packager: rpm
    type: doc
    file_info:
      mode: 0644
