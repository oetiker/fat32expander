name: Rust Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Install test dependencies
      run: |
        echo "::group::Installing dependencies"
        sudo apt-get update && sudo apt-get install -y dosfstools mtools qemu-system-x86 musl-tools
        echo "::endgroup::"

    - name: Install musl target for static builds
      run: rustup target add x86_64-unknown-linux-musl

    - name: Check formatting
      run: |
        echo "::group::Checking code formatting"
        cargo fmt -- --check
        echo "::endgroup::"

    - name: Run clippy
      run: |
        echo "::group::Running clippy lints"
        cargo clippy -- -D warnings
        echo "::endgroup::"

    - name: Build
      run: |
        echo "::group::Building project"
        cargo build --release
        echo "::endgroup::"

    - name: Run unit tests
      run: |
        echo "::group::Running unit tests"
        cargo test --lib 2>&1 | tee unit-test-results.txt
        UNIT_EXIT=${PIPESTATUS[0]}

        # Parse results from standard test output
        if grep -q "test result:" unit-test-results.txt; then
          RESULTS=$(grep "test result:" unit-test-results.txt | tail -1)
          echo "## Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "$RESULTS" >> $GITHUB_STEP_SUMMARY
        fi

        echo "::endgroup::"
        exit $UNIT_EXIT

    - name: Run integration tests
      run: |
        echo "::group::Running integration tests"
        cargo test --test integration_test -- --ignored 2>&1 | tee integration-test-results.txt
        INTEGRATION_EXIT=${PIPESTATUS[0]}

        # Parse results from standard test output
        if grep -q "test result:" integration-test-results.txt; then
          RESULTS=$(grep "test result:" integration-test-results.txt | tail -1)
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "$RESULTS" >> $GITHUB_STEP_SUMMARY
        fi

        echo "::endgroup::"
        exit $INTEGRATION_EXIT

    - name: Run durability tests
      run: |
        echo "::group::Running durability tests"
        # The device-journal feature is what makes sync barriers observable; the
        # suite compiles to nothing without it, so it must be named explicitly
        # or these tests silently stop existing.
        cargo test --features device-journal --test durability_test -- --ignored 2>&1 \
          | tee durability-test-results.txt
        DURABILITY_EXIT=${PIPESTATUS[0]}

        if grep -q "test result:" durability-test-results.txt; then
          RESULTS=$(grep "test result:" durability-test-results.txt | tail -1)
          echo "## Durability Test Results" >> $GITHUB_STEP_SUMMARY
          echo "$RESULTS" >> $GITHUB_STEP_SUMMARY
        fi

        echo "::endgroup::"
        exit $DURABILITY_EXIT

    - name: Run test script
      run: |
        echo "::group::Running test-resize.sh"
        ./scripts/test-resize.sh
        echo "## Test Script" >> $GITHUB_STEP_SUMMARY
        echo "✅ test-resize.sh passed" >> $GITHUB_STEP_SUMMARY
        echo "::endgroup::"

    - name: Setup Alpine for QEMU tests
      run: |
        echo "::group::Setting up Alpine Linux for QEMU"
        ./scripts/qemu/setup-alpine.sh setup
        echo "::endgroup::"

    - name: Build static binary for QEMU tests
      run: |
        echo "::group::Building static musl binary"
        cargo build --release --target x86_64-unknown-linux-musl
        echo "::endgroup::"

    - name: Run QEMU tests
      run: |
        echo "::group::Running QEMU-based tests"
        ./scripts/qemu/test-qemu.sh 2>&1 | tee qemu-test-results.txt
        QEMU_EXIT=${PIPESTATUS[0]}

        # Add summary
        echo "## QEMU Test Results" >> $GITHUB_STEP_SUMMARY
        if [ $QEMU_EXIT -eq 0 ]; then
          PASSED=$(grep -c "PASSED" qemu-test-results.txt || echo "0")
          echo "✅ All QEMU tests passed ($PASSED tests)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ QEMU tests failed" >> $GITHUB_STEP_SUMMARY
          grep -E "(FAILED|ERROR)" qemu-test-results.txt >> $GITHUB_STEP_SUMMARY || true
        fi

        echo "::endgroup::"
        exit $QEMU_EXIT

    - name: Run crash recovery tests
      run: |
        echo "::group::Running crash recovery tests"
        # Not discovered by test-qemu.sh - it globs scripts/qemu/tests/ and this
        # suite lives one level up, because it builds its own fault-injection
        # binary and drives the VM differently. It must be invoked explicitly,
        # or the only test of the checkpoint and resume machinery never runs.
        ./scripts/qemu/test-crash-recovery.sh 2>&1 | tee crash-recovery-results.txt
        CRASH_EXIT=${PIPESTATUS[0]}

        echo "## Crash Recovery Results" >> $GITHUB_STEP_SUMMARY
        if [ $CRASH_EXIT -eq 0 ]; then
          PASSED=$(grep -oP 'Passed: \K[0-9]+' crash-recovery-results.txt | tail -1)
          echo "✅ All crash points recovered (${PASSED:-?} points)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Crash recovery failed" >> $GITHUB_STEP_SUMMARY
          grep -E "(FAILED|ERROR)" crash-recovery-results.txt >> $GITHUB_STEP_SUMMARY || true
        fi

        echo "::endgroup::"
        exit $CRASH_EXIT

