name: Release build

# Called by Create release PR on the release branch before the pull request
# exists (D28). The three repo-infra release pieces it calls build the
# archives, the deb and rpm packages from the musl archives, and the bottles
# with the rewritten Formula/fat32expander.rb (D32). Read-only: nothing here writes
# the repository.
on:
  workflow_call:
    inputs:
      version:
        description: The version being released.
        type: string
        required: true
      ref:
        description: The release branch head to build.
        type: string
        required: true

permissions:
  contents: read

jobs:
  binaries:
    uses: oposs/repo-infra/.github/workflows/ri-release-rust-binaries.yml@v2
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      bin: fat32expander
      # No Windows build: the program opens and locks raw block devices
      # through Unix file APIs. The native-targets exception in
      # .github/repo-infra.json says so (D34).
      targets: >-
        x86_64-unknown-linux-musl aarch64-unknown-linux-musl
        x86_64-unknown-illumos x86_64-apple-darwin aarch64-apple-darwin

  packages:
    needs: binaries
    uses: oposs/repo-infra/.github/workflows/ri-release-nfpm.yml@v2
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      config: nfpm.yaml
      packagers: '{"deb": {}, "rpm": {}}'
      archives: x86_64-unknown-linux-musl aarch64-unknown-linux-musl

  homebrew:
    needs: binaries
    uses: oposs/repo-infra/.github/workflows/ri-release-homebrew.yml@v2
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      bin: fat32expander
