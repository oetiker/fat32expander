[package]
name = "fat32expander"
version = "0.0.2"
edition = "2021"
authors = ["Tobias Oetiker"]
description = "Resize FAT32 filesystems in-place after partition has been grown"
license = "MIT"
readme = "README.md"

[features]
default = ["cli"]
# The `fat32expander` command. A program that uses only the library can set
# `default-features = false` and skip building clap and anyhow ([F-27]).
cli = ["dep:clap", "dep:anyhow"]
# Enable fault injection for crash recovery testing
# Build with: cargo build --features fault-injection
fault-injection = []
# Record device writes and syncs so tests can assert durability ordering.
# Test with: cargo test --features device-journal
# [F-R17]/[F-R18]: a missing sync barrier is invisible to every other harness --
# killing the process still lets the page cache flush everything -- so the order
# in which the device is told to flush has to be observable to be testable.
device-journal = []

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
thiserror = "1.0"
anyhow = { version = "1.0", optional = true }
libc = "0.2"
crc32fast = "1.4"

[dev-dependencies]
proptest = "1.11"
tempfile = "3.0"

[[bin]]
name = "fat32expander"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "fat32expander"
path = "src/lib.rs"
